  #         channel: stable
  #     - name: Import Developer ID certificate
  #       env:
  #         CERT: ${{ secrets.MAC_DEVELOPER_ID_CERT_P12_BASE64 }}
  #         PASS: ${{ secrets.MAC_DEVELOPER_ID_CERT_PASSWORD }}
  #       run: |
  #         echo "$CERT" | base64 -d > cert.p12
  #         security create-keychain -p ci build.keychain
  #         security default-keychain -s build.keychain
  #         security unlock-keychain -p ci build.keychain
  #         security import cert.p12 -k build.keychain -P "$PASS" -T /usr/bin/codesign
  #         security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
  #         rm cert.p12
