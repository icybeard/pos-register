name: Release

# Publishes installable builds of the register to GitHub Releases — the
# download surface jurek.kz/download points at.
#
# Trigger: push a version tag (`git tag v0.1.0 && git push origin v0.1.0`), or
# run manually from the Actions tab to smoke-test the build matrix without
# creating a release.
#
# macOS/iOS jobs are scaffolded below but commented out: both need the Apple
# Developer secrets to exist first. Enable them per docs/APPLE_RELEASE.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      apple:
        description: "Also build + upload the iOS TestFlight build (needs APPLE_* secrets)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            artifact: windows-x64
          - os: ubuntu-latest
            label: Linux x64
            artifact: linux-x64
          # Android is built but NOT published yet: without the release keystore
          # every APK is debug-signed, and Android refuses an update whose
          # signature changed — early adopters would have to uninstall (losing
          # their local data) once the real key arrives. Re-add this row once
          # the ANDROID_* secrets exist; the signing steps below already handle
          # it. See docs/RELEASING.md.
          # - os: ubuntu-latest
          #   label: Android APK
          #   artifact: android
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # GTK for the Flutter shell, libsecret + jsoncpp for
      # flutter_secure_storage_linux (it pkg_check_modules on libsecret-1 and
      # fails the CMake configure step without it).
      - name: Install Linux build deps
        if: matrix.artifact == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config \
            libsecret-1-dev libjsoncpp-dev

      - name: Set up Java (Android)
        if: matrix.artifact == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: flutter pub get

      - name: Resolve version
        id: version
        shell: bash
        run: |
          # v0.1.0 → 0.1.0; manual runs label the artifact with the short SHA.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # --- Windows -------------------------------------------------------
      - name: Build Windows
        if: matrix.artifact == 'windows-x64'
        # local_auth_windows 1.x still includes <experimental/coroutine>, which
        # current MSVC rejects outright (STL1011) rather than warning about.
        # CL prepends the documented escape hatch to every compile. Drop this
        # once local_auth is upgraded to a build that uses C++20 <coroutine>.
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release

      # Two Windows artifacts on purpose: the MSI is what a shop owner wants
      # (Start-menu + desktop shortcuts, Add/Remove Programs, upgrades in
      # place), the zip is the fallback for machines where the user can't run
      # an installer — locked-down tills, no admin rights, or a USB stick.
      - name: Package Windows (zip)
        if: matrix.artifact == 'windows-x64'
        shell: pwsh
        run: |
          $name = "KeregeSystem-Kassa-${{ steps.version.outputs.value }}-windows-x64.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $name

      - name: Package Windows (msi)
        if: matrix.artifact == 'windows-x64'
        shell: pwsh
        run: |
          # Pinned, and pinned to the SAME version: `wix extension add` rejects
          # a version wildcard outright, and an extension built against another
          # WiX release fails to load.
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          # MSI ProductVersion only accepts x.y.z numerics, so a manual run
          # ("dev-1a2b3c4") gets a placeholder — the installer is a throwaway
          # there anyway; tagged builds carry the real version.
          $v = "${{ steps.version.outputs.value }}"
          if ($v -notmatch '^\d+\.\d+\.\d+$') { $v = "0.0.0" }
          $name = "KeregeSystem-Kassa-${{ steps.version.outputs.value }}-windows-x64.msi"
          # ABSOLUTE path: WiX resolves a relative Files/@Include against the
          # .wxs file's own folder (windows/installer/), not the working
          # directory — a relative path silently harvests nothing and yields a
          # valid but empty installer.
          $buildDir = (Resolve-Path "build/windows/x64/runner/Release").Path
          wix build windows/installer/Package.wxs `
            -arch x64 `
            -ext WixToolset.UI.wixext `
            -pdbtype none `
            -d AppVersion="$v" `
            -d BuildDir="$buildDir" `
            -o $name

          # Guard against exactly the failure above: an MSI that builds
          # "successfully" while containing no application files. The payload is
          # ~18 MB, so anything under 5 MB means the harvest broke.
          $sizeMb = (Get-Item $name).Length / 1MB
          Write-Host ("MSI size: {0:N1} MB" -f $sizeMb)
          if ($sizeMb -lt 5) {
            throw "MSI is only $([math]::Round($sizeMb,1)) MB — the application files were not harvested."
          }

      # --- Linux ---------------------------------------------------------
      - name: Build Linux
        if: matrix.artifact == 'linux-x64'
        run: flutter build linux --release

      - name: Package Linux
        if: matrix.artifact == 'linux-x64'
        run: |
          NAME="KeregeSystem-Kassa-${{ steps.version.outputs.value }}-linux-x64.tar.gz"
          tar -czf "$NAME" -C build/linux/x64/release/bundle .

      # --- Android -------------------------------------------------------
      # Unsigned APKs can be installed but not updated in place, so the release
      # key is required for anything users keep. When the secrets are absent the
      # build still runs (debug-signed) so the matrix stays green on forks.
      - name: Configure Android signing
        if: matrix.artifact == 'android' && env.KEYSTORE != ''
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build Android APK
        if: matrix.artifact == 'android'
        run: flutter build apk --release

      - name: Package Android
        if: matrix.artifact == 'android'
        run: |
          NAME="KeregeSystem-Kassa-${{ steps.version.outputs.value }}-android.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$NAME"

      - name: Remove signing material
        if: always() && matrix.artifact == 'android'
        run: rm -f android/key.properties android/upload-keystore.jks

      # Glob rather than a named variable: Windows produces two files (msi+zip)
      # and every packaging step drops its output in the workspace root.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: KeregeSystem-Kassa-*
          if-no-files-found: error

  # iOS → TestFlight. Runs on a version tag, or on a manual dispatch with the
  # `apple` box ticked (so a plain desktop smoke-test dispatch stays iOS-free).
  # Signing is automatic, driven by the App Store Connect API key: xcodebuild
  # creates/downloads the distribution cert + provisioning profile on the fly,
  # so no .p12 or profile secret is needed. Setup: docs/APPLE_RELEASE.md.
  ios-testflight:
    name: iOS TestFlight
    runs-on: macos-14
    if: startsWith(github.ref, 'refs/tags/v') || inputs.apple
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # altool AND xcodebuild auto-discover the key in these well-known folders,
      # so no auth flags need threading through `flutter build ipa`.
      - name: Install App Store Connect API key
        env:
          P8: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys ~/.appstoreconnect/private_keys
          echo "$P8" | base64 -d > ~/private_keys/AuthKey_${KEY_ID}.p8
          cp ~/private_keys/AuthKey_${KEY_ID}.p8 ~/.appstoreconnect/private_keys/

      # `flutter build ipa` cannot thread the API key into the archive step, so
      # xcodebuild does the signing itself: -allowProvisioningUpdates plus the
      # authentication key lets it create the distribution cert + profile for
      # kz.keregesystem.pos on the fly. `--config-only` just generates the Xcode
      # project + pods; the Flutter/Dart compile runs inside xcodebuild's build
      # phase during archive.
      - name: Build signed IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          flutter build ios --release --config-only --no-codesign

          KEY="$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY"
                -authenticationKeyID "$KEY_ID"
                -authenticationKeyIssuerID "$ISSUER_ID")

          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos \
            -archivePath "$PWD/build/ios/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" "${AUTH[@]}" archive

          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$PWD/build/ios/Runner.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$PWD/build/ios/ipa" \
            "${AUTH[@]}"

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app -f build/ios/ipa/*.ipa -t ios \
            --apiKey "${{ secrets.APPLE_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPLE_API_ISSUER_ID }}"

  # === macOS — SCAFFOLD, disabled until MAC_DEVELOPER_ID_* secrets exist ======
  # Enable per docs/APPLE_RELEASE.md §3 (Developer ID cert → notarized .dmg).
  #
  # macos:
  #   name: macOS (.dmg, notarized)
  #   runs-on: macos-14
  #   if: startsWith(github.ref, 'refs/tags/v')
  #   timeout-minutes: 40
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         submodules: recursive
  #     - uses: subosito/flutter-action@v2
