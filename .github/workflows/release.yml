  #       run: |
  #         flutter build macos --release
  #         APP="build/macos/Build/Products/Release/KeregePOS.app"
  #         codesign --deep --force --options runtime \
  #           --sign "Developer ID Application" "$APP"
  #         echo "${{ secrets.APPLE_API_KEY_P8_BASE64 }}" | base64 -d > key.p8
  #         DMG="KeregeSystem-Kassa-${{ github.ref_name }}-macos.dmg"
  #         hdiutil create -volname KeregePOS -srcfolder "$APP" -ov -format UDZO "$DMG"
