name: Release

# Publishes installable builds of the register to GitHub Releases — the
# download surface jurek.kz/download points at.
#
# Trigger: push a version tag (`git tag v0.1.0 && git push origin v0.1.0`), or
# run manually from the Actions tab to smoke-test the build matrix without
# creating a release.
#
# macOS/iOS are deliberately absent: both need a paid Apple Developer identity
# to produce something a shop owner can actually open (Gatekeeper blocks
# unsigned .app bundles, iOS won't sideload at all). See
# pos-docs/specs/platform/03-device-linking.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            artifact: windows-x64
          - os: ubuntu-latest
            label: Linux x64
            artifact: linux-x64
          # Android is built but NOT published yet: without the release keystore
          # every APK is debug-signed, and Android refuses an update whose
          # signature changed — early adopters would have to uninstall (losing
          # their local data) once the real key arrives. Re-add this row once
          # the ANDROID_* secrets exist; the signing steps below already handle
          # it. See docs/RELEASING.md.
          # - os: ubuntu-latest
          #   label: Android APK
          #   artifact: android
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # GTK for the Flutter shell, libsecret + jsoncpp for
      # flutter_secure_storage_linux (it pkg_check_modules on libsecret-1 and
      # fails the CMake configure step without it).
      - name: Install Linux build deps
        if: matrix.artifact == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config \
            libsecret-1-dev libjsoncpp-dev

      - name: Set up Java (Android)
        if: matrix.artifact == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: flutter pub get

      - name: Resolve version
        id: version
        shell: bash
        run: |
          # v0.1.0 → 0.1.0; manual runs label the artifact with the short SHA.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # --- Windows -------------------------------------------------------
      - name: Build Windows
        if: matrix.artifact == 'windows-x64'
        # local_auth_windows 1.x still includes <experimental/coroutine>, which
        # current MSVC rejects outright (STL1011) rather than warning about.
        # CL prepends the documented escape hatch to every compile. Drop this
        # once local_auth is upgraded to a build that uses C++20 <coroutine>.
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release

      # Two Windows artifacts on purpose: the MSI is what a shop owner wants
      # (Start-menu + desktop shortcuts, Add/Remove Programs, upgrades in
      # place), the zip is the fallback for machines where the user can't run
      # an installer — locked-down tills, no admin rights, or a USB stick.
      - name: Package Windows (zip)
        if: matrix.artifact == 'windows-x64'
        shell: pwsh
        run: |
          $name = "KeregeSystem-Kassa-${{ steps.version.outputs.value }}-windows-x64.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $name

      - name: Package Windows (msi)
        if: matrix.artifact == 'windows-x64'
        shell: pwsh
        run: |
          # Pinned, and pinned to the SAME version: `wix extension add` rejects
          # a version wildcard outright, and an extension built against another
          # WiX release fails to load.
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          # MSI ProductVersion only accepts x.y.z numerics, so a manual run
          # ("dev-1a2b3c4") gets a placeholder — the installer is a throwaway
          # there anyway; tagged builds carry the real version.
          $v = "${{ steps.version.outputs.value }}"
          if ($v -notmatch '^\d+\.\d+\.\d+$') { $v = "0.0.0" }
          $name = "KeregeSystem-Kassa-${{ steps.version.outputs.value }}-windows-x64.msi"
          wix build windows/installer/Package.wxs `
            -arch x64 `
            -ext WixToolset.UI.wixext `
            -d AppVersion="$v" `
            -d BuildDir="build/windows/x64/runner/Release" `
            -o $name

      # --- Linux ---------------------------------------------------------
      - name: Build Linux
        if: matrix.artifact == 'linux-x64'
        run: flutter build linux --release

      - name: Package Linux
        if: matrix.artifact == 'linux-x64'
        run: |
          NAME="KeregeSystem-Kassa-${{ steps.version.outputs.value }}-linux-x64.tar.gz"
          tar -czf "$NAME" -C build/linux/x64/release/bundle .

      # --- Android -------------------------------------------------------
      # Unsigned APKs can be installed but not updated in place, so the release
      # key is required for anything users keep. When the secrets are absent the
      # build still runs (debug-signed) so the matrix stays green on forks.
      - name: Configure Android signing
        if: matrix.artifact == 'android' && env.KEYSTORE != ''
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build Android APK
        if: matrix.artifact == 'android'
        run: flutter build apk --release

      - name: Package Android
        if: matrix.artifact == 'android'
        run: |
          NAME="KeregeSystem-Kassa-${{ steps.version.outputs.value }}-android.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$NAME"

      - name: Remove signing material
        if: always() && matrix.artifact == 'android'
        run: rm -f android/key.properties android/upload-keystore.jks

      # Glob rather than a named variable: Windows produces two files (msi+zip)
      # and every packaging step drops its output in the workspace root.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: KeregeSystem-Kassa-*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Касса KeregeSystem — бесплатно, навсегда, работает офлайн.

            Скачайте сборку для своей платформы ниже. Установка не требует
            регистрации: все данные о продажах остаются на вашем устройстве.
            Подключение к облачной платформе — по желанию, в настройках кассы.

            macOS и iOS сборки пока не публикуем — они требуют платной подписи
            Apple. Собрать из исходников можно на любой платформе.
